name: iOS
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".impeccable/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".impeccable/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          swift --version
          brew list --versions cmake || brew install cmake
          brew list --versions xcodegen || brew install xcodegen
      - name: Test caption and provider logic
        run: swift test --package-path Packages/KaptusCore
      - uses: actions/cache@v4
        with:
          path: |
            Vendor
            .build-cache
            Kaptus/Resources/Models
          key: whisper-927cfce-base-en-q5-1-v1-xcode26-3-${{ runner.arch }}
      - name: Prepare bundled recognizer and models
        run: |
          bash scripts/bootstrap.sh > native-build.log 2>&1 || { tail -120 native-build.log; exit 1; }
      - name: Cache verified native build
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor
            .build-cache
            Kaptus/Resources/Models
          key: whisper-927cfce-base-en-q5-1-v1-xcode26-3-${{ runner.arch }}
      - name: Compile iPhone release
        run: xcodebuild -project Kaptus.xcodeproj -scheme Kaptus -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build > device-build.log 2>&1 || { tail -120 device-build.log; exit 1; }
      - name: Verify offline iPhone bundle
        run: python3 scripts/verify_bundle.py DerivedData/Build/Products/Release-iphoneos/Kaptus.app
      - name: Run iPhone simulator tests
        timeout-minutes: 15
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 scripts/select_simulator.py)
          echo "KAPTUS_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project Kaptus.xcodeproj -scheme Kaptus -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath DerivedData -resultBundlePath artifacts/UITests.xcresult -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test > simulator-test.log 2>&1 || { tail -160 simulator-test.log; exit 1; }
      - name: Capture native simulator screens
        if: always() && env.KAPTUS_SIMULATOR != ''
        run: |
          python3 scripts/capture_screenshots.py "$KAPTUS_SIMULATOR"
          xcrun xcresulttool export attachments --path artifacts/UITests.xcresult --output-path artifacts/attachments || true
      - name: Package simulator app and generated project
        if: always()
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent Kaptus.xcodeproj artifacts/Kaptus-project.zip || true
          APP=$(find DerivedData/Build/Products -path '*iphonesimulator/Kaptus.app' -maxdepth 3 | head -1)
          if [ -n "$APP" ]; then ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/Kaptus-simulator.zip; fi
          cp *-build.log *-test.log artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaptus-ios-verification
          path: artifacts/
          retention-days: 14
